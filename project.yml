# Definición del proyecto para XcodeGen (https://github.com/yonaskolb/XcodeGen).
#
# El .xcodeproj ya está incluido en el repositorio; este archivo es la vía
# alternativa para regenerarlo desde cero:
#
#   brew install xcodegen
#   cd IOS && xcodegen generate
#
name: Finanz
options:
  bundleIdPrefix: com.finanz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: es

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Finanz:
    type: application
    platform: iOS
    sources:
      - path: Finanz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.finanz.app
        PRODUCT_NAME: Finanz
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
